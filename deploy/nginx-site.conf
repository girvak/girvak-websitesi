# GİRVAK — host nginx. The only place that decides which path goes where.
#
#   /            -> site      (Astro SSR, :8083)
#   /api/...     -> backend   (:8082, the /api prefix is stripped here)
#   /media/...   -> backend   (mirrored Airtable attachments, immutable)
#
# TLS: Cloudflare Origin CA at /etc/ssl/girvak/ (see deploy/ssl/README.md).
# Cloudflare Real IP: /etc/nginx/conf.d/cloudflare-realip.conf (written by deploy.sh).
# Install via: sudo ./deploy/deploy.sh
#
# Edge SSL is Cloudflare's. Origin speaks HTTPS so SSL/TLS mode can be Full (strict).

upstream girvak_site {
    server 127.0.0.1:8083;
    keepalive 16;
}

upstream girvak_api {
    server 127.0.0.1:8082;
    keepalive 16;
}

# Client scheme as seen by Cloudflare (or direct HTTPS to origin).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# ---------- HTTP: force HTTPS (apex) ----------
server {
    listen 80;
    listen [::]:80;
    server_name girisimcilikvakfi.org www.girisimcilikvakfi.org;
    return 301 https://girisimcilikvakfi.org$request_uri;
}

# ---------- HTTPS: www -> apex ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.girisimcilikvakfi.org;

    ssl_certificate     /etc/ssl/girvak/origin.pem;
    ssl_certificate_key /etc/ssl/girvak/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    return 301 https://girisimcilikvakfi.org$request_uri;
}

# ---------- HTTPS: site ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name girisimcilikvakfi.org;

    ssl_certificate     /etc/ssl/girvak/origin.pem;
    ssl_certificate_key /etc/ssl/girvak/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;

    # Only the newsletter form posts, and it posts one email address.
    client_max_body_size 64k;

    # Security headers come from the app (site middleware and API middleware).

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    location /media/ {
        proxy_pass http://girvak_api/media/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        access_log off;
    }

    # Trailing slash on proxy_pass strips /api: /api/v1/newsletter -> /v1/newsletter.
    location /api/ {
        proxy_pass http://girvak_api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://girvak_site;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 30s;
    }

    location /_astro/ {
        proxy_pass http://girvak_site;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
    }
}
