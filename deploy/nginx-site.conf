# GİRVAK — host nginx. The only place that decides which path goes where.
#
#   /            -> site      (Astro SSR, :8083)
#   /api/...     -> backend   (:8082, the /api prefix is stripped here)
#   /media/...   -> backend   (mirrored Airtable attachments, immutable)
#
# Install:
#   sudo cp deploy/nginx-site.conf /etc/nginx/sites-available/girvak
#   sudo ln -sf /etc/nginx/sites-available/girvak /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS is added by certbot (see docs/operations/deployment.md).

upstream girvak_site {
    server 127.0.0.1:8083;
    keepalive 16;
}

upstream girvak_api {
    server 127.0.0.1:8082;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name girisimcilikvakfi.org www.girisimcilikvakfi.org;

    # Only the newsletter form posts, and it posts one email address.
    client_max_body_size 64k;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    # Mirrored attachments. The backend already marks these immutable — the
    # filename carries Airtable's attachment id, so a given URL never changes
    # body. nginx passes that header through instead of adding a second one.
    location /media/ {
        proxy_pass http://girvak_api/media/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        access_log off;
    }

    # The API, same origin as the pages. The trailing slash on proxy_pass is what
    # strips the /api prefix: /api/v1/newsletter -> /v1/newsletter.
    location /api/ {
        proxy_pass http://girvak_api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Everything else is a page, rendered per request by the site process.
    location / {
        proxy_pass http://girvak_site;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Astro's hashed build output. The site already sends an immutable
    # Cache-Control for these; this block exists only to keep them out of the
    # access log.
    location /_astro/ {
        proxy_pass http://girvak_site;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
    }
}
