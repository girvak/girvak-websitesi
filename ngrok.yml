# Local tunnels for the GİRVAK website.
# The authtoken lives in the global config:
#   ~/Library/Application Support/ngrok/ngrok.yml
#
# Start (merges global + this file, runs only the girvak tunnel):
#   ngrok start --config "$HOME/Library/Application Support/ngrok/ngrok.yml",ngrok.yml girvak
#
# NOTE — a SECOND project is tunnelled from this machine, so:
#   * The reserved domain (cobweb-liable-suspect.ngrok-free.dev) can only be
#     claimed by ONE agent at a time. Whoever grabs it first wins; the other
#     side gets an ephemeral https://<random>.ngrok-free.dev URL. No `domain:`
#     key here on purpose — so starting GİRVAK never steals a live tunnel.
#     Add `domain: cobweb-liable-suspect.ngrok-free.dev` back only when the
#     other project's agent is stopped.
#   * Each agent process needs its own inspector port. This one pins 4041 and
#     leaves the default 4040 to the other project, so neither dies with
#     "bind: address already in use".
#   * Free plan allows a limited number of simultaneous agent sessions. If this
#     fails with ERR_NGROK_108, add the other project as a second tunnel here
#     and run both from a single agent: `ngrok start girvak other`.
version: "3"
agent:
  web_addr: 127.0.0.1:4041
tunnels:
  girvak:
    # Pinned to IPv4: `astro dev` binds [::1] only unless started with
    # `--host 127.0.0.1`, and a bare `4321` can resolve the other way.
    addr: 127.0.0.1:4321 # astro dev server (proxies /api -> 127.0.0.1:8000)
    proto: http
